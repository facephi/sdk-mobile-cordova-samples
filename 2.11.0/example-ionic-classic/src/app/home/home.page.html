<ion-header [translucent]="true">
  <ion-toolbar color="bluefp">
      <ion-title class="labelTitleSelphi">
          Sdk Mobile
      </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="centered-content">
    <ion-grid class="centered-grid">
        <!-- BestImage -->
        <ion-row class="titleRowSelphid" *ngIf="selphiResult?.bestImageCropped">
            <ion-col size="2"></ion-col>
            <ion-col class='titleColSelphid'>
                <ion-label class='labelTitleSelphid'>BestImage</ion-label>
            </ion-col>
            <ion-col size="2"></ion-col>
        </ion-row>
        <ion-row class="imgRowSelphi" *ngIf="selphiResult?.bestImageCropped">
            <ion-col size="2"></ion-col>
            <ion-col size="8" class="documentImgColSelphid">
                <ion-img [src]="selphiResult?.bestImageCropped"></ion-img>
            </ion-col>
            <ion-col size="2"></ion-col>
        </ion-row>
        <!-- Front Title -->
        <ion-row class="titleRowSelphid" *ngIf="selphidResult?.frontDocumentImage !== null">
            <ion-col size="2"></ion-col>
            <ion-col class='titleColSelphid'>
                <ion-label class='labelTitleSelphid'>Frente</ion-label>
            </ion-col>
            <ion-col size="2"></ion-col>
        </ion-row>
        <!-- Front Image -->
        <ion-row class="imageRowSelphid" *ngIf="selphidResult?.frontDocumentImage !== null">
            <ion-col size="2"></ion-col>
            <ion-col size="8" class="documentImgColSelphid">
                <ion-img [src]="selphidResult?.frontDocumentImage"></ion-img>
            </ion-col>
            <ion-col size="2"></ion-col>
        </ion-row>
        <!-- Back Title -->
        <ion-row class="titleRowSelphid" *ngIf="selphidResult?.backDocumentImage !== null">
            <ion-col size="2"></ion-col>
            <ion-col class='titleColSelphid'>
                <ion-label class='labelTitleSelphid'>Dorso</ion-label>
            </ion-col>
            <ion-col size="2"></ion-col>
        </ion-row>
        <!-- Back Image -->
        <ion-row class="imageRowSelphid" *ngIf="selphidResult?.backDocumentImage !== null">
            <ion-col size="2"></ion-col>
            <ion-col size="8" class="documentImgColSelphid">
                <ion-img [src]="selphidResult?.backDocumentImage"></ion-img>
            </ion-col>
            <ion-col size="2"></ion-col>
        </ion-row>
        <!-- Face Title -->
        <ion-row class="titleRowSelphid" *ngIf="selphidResult?.faceImage !== null">
            <ion-col size="2"></ion-col>
            <ion-col class="titleColSelphid" style='text-align: center'>
                <ion-label class='labelTitleSelphid'>Selfie</ion-label>
            </ion-col>
            <ion-col size="2"></ion-col>
        </ion-row>
        <!-- Face Image -->
        <ion-row class="imageRowSelphid" *ngIf="selphidResult?.faceImage !== null">
            <ion-col size="3"></ion-col>
            <ion-col size="6" class="documentImgColSelphid">
                <ion-img [src]="selphidResult?.faceImage" onerror="this.src='./assets/images/image_no_available.png'"></ion-img>
            </ion-col>
            <ion-col size="3"></ion-col>
        </ion-row>
        
        <ion-row *ngIf="showError" class="errorRowSelphid">
            <ion-col size="1"></ion-col>
            <ion-col class='titleColSelphid'>
                <ion-label style="color: crimson;" class='labelTitleSelphid'>{{message}}</ion-label>
            </ion-col>
            <ion-col size="1"></ion-col>
        </ion-row>
        <!-- documentData button and sheet -->
        <ion-row class="buttonRowSdk" *ngIf="selphidResult?.documentData">
            <ion-col class="buttonColSdk">
                <ion-button class="buttonSdk" (click)="openDocumentDataSheet()">Show OCR</ion-button>
            </ion-col>
        </ion-row>
        <ion-row class="buttonRowSdk">
            <ion-col class="buttonColSdk">
                <ion-button class="buttonSdk" (click)='onLaunchSelphiProcess()' color="bluefp">Selphi</ion-button>
            </ion-col>
        </ion-row>
        <ion-row class="buttonRowSdk">
            <ion-col class="buttonColSdk">
                <ion-button class="buttonSdk" (click)='onLaunchSelphIDProcess()' color="bluefp">Selphid</ion-button>
            </ion-col>
        </ion-row>
        <ion-row class="buttonRowSdk" *ngIf="selphidResult !== null && selphiResult !== null">
            <ion-col class="buttonColSdk">
                <ion-button class="buttonSdk" (click)='onGetExtraData()' color="bluefp">GetExtraData</ion-button>
            </ion-col>
        </ion-row>
        <ion-row class="buttonRowSdk">
            <ion-col class="buttonColSdk">
                <ion-button class="buttonSdk" (click)='onInitOperation()' color="bluefp">InitOperation</ion-button>
            </ion-col>
        </ion-row>
        <ion-row class="buttonRowSdk">
            <ion-col class="buttonColSdk">
                <ion-button class="buttonSdk" (click)='onInitSession()' color="bluefp">InitSession</ion-button>
            </ion-col>
        </ion-row>
        <ion-row class="buttonRowSdk">
            <ion-col class="buttonColSdk">
                <ion-button class="buttonSdk" (click)='onCloseSession()' color="bluefp">CloseSession</ion-button>
            </ion-col>
        </ion-row>
        <ion-row class="buttonRowSdk">
            <ion-col class="buttonColSdk">
                <ion-button class="buttonSdk" (click)='onLaunchFlow()' color="bluefp">Flow</ion-button>
            </ion-col>
        </ion-row>

        <ion-modal
            [isOpen]="isDocumentDataSheetOpen"
            [initialBreakpoint]="0.7"
            [breakpoints]="[0, 0.4, 0.7, 1]"
            (didDismiss)="closeDocumentDataSheet()">
            <ng-template>
                <ion-header>
                    <ion-toolbar>
                        <ion-title>DocumentData</ion-title>
                        <ion-buttons slot="end">
                            <ion-button (click)="closeDocumentDataSheet()">Ocultar</ion-button>
                        </ion-buttons>
                    </ion-toolbar>
                </ion-header>
                <ion-content class="ion-padding">
                    <ion-list>
                        <ion-item style="font-size: 0.8rem;">DATOS OBTENIDOS</ion-item>
                        <ion-item *ngFor="let item of selphidResult?.documentData | keyvalue " style="font-size: 0.7rem;">
                            <ion-label text-capitalize item-left>{{item.key}}</ion-label>
                            <ion-label item-right text-right>{{ $any(item.value) | uppercase }}</ion-label>
                        </ion-item>
                    </ion-list>
                </ion-content>
            </ng-template>
        </ion-modal>
    </ion-grid>
</ion-content>
