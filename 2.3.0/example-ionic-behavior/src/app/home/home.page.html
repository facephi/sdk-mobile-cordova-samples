<ion-header>
    <ion-toolbar color="bluefp">
        <ion-buttons slot="end">
            <ion-button (click)="goToLogin()">
                Login
                <ion-icon slot="end" name="chevron-forward"></ion-icon>
            </ion-button>
        </ion-buttons>
        <ion-title class="labelTitleSelphi">
          Mobile 360
        </ion-title>
    </ion-toolbar>
</ion-header>

<ion-content class="centered-content">
    <ion-grid class="centered-grid">
        <ion-row class="messageRowSdk">
            <ion-col class="buttonColSdk">{{ message }}</ion-col>
        </ion-row>
        <ion-row class="buttonRowSdk">
            <ion-col class="buttonColSdk">
                <ion-button class="buttonSdk" (click)='launchDestroy()' color="bluefp">Launch Destroy</ion-button>
            </ion-col>
        </ion-row>
        <ion-row class="buttonRowSdk">
            <ion-col class="buttonColSdk">
                <ion-button class="buttonSdk" (click)='launchClearSessionData()' color="bluefp">Clear Session Data</ion-button>
            </ion-col>
        </ion-row>
        <ion-row class="buttonRowSdk">
            <ion-col class="buttonColSdk">
                <ion-button class="buttonSdk" (click)='launchInitialize()' color="bluefp">Launch Initialization</ion-button>
            </ion-col>
        </ion-row>
        <ion-row class="buttonRowSdk">
            <ion-col class="buttonColSdk">
                <ion-button class="buttonSdk" (click)='launchSetUserId()' color="bluefp">Set User Id</ion-button>
            </ion-col>
        </ion-row>
    </ion-grid>
</ion-content>
